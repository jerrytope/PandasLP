<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #B8860B; }
    a:hover { color: #D4A84B; }
  </style>
</helmet>
<div style="width:1080px;height:1350px;background:#FAFAF8;display:flex;flex-direction:column;box-sizing:border-box;padding:90px 74px 64px;font-family:'Source Sans 3',sans-serif;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:34px;height:1px;background:#B8860B;"></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2.6px;color:#6B6B6B;">THE PROCESS</div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2px;color:#9A968D;">4 / 6</div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;">
    <div style="font-family:'Playfair Display',serif;font-weight:600;font-size:64px;line-height:1.12;color:#1A1A1A;">From a letter</div>
    <div style="font-family:'Playfair Display',serif;font-weight:600;font-style:italic;font-size:64px;line-height:1.12;color:#B8860B;margin-bottom:48px;">to a court date.</div>

    <div style="display:flex;gap:24px;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;color:#B8860B;width:44px;flex-shrink:0;">01</div>
      <div style="display:flex;flex-direction:column;padding-bottom:34px;border-left:1px solid #E8E4DF;padding-left:24px;margin-left:-1px;">
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:20px;letter-spacing:2px;color:#1A1A1A;">DEMAND LETTER</div>
        <div style="font-family:'Source Sans 3',sans-serif;font-size:24px;color:#6B6B6B;margin-top:8px;">Fourteen days to respond. Silence counts as an answer.</div>
      </div>
    </div>
    <div style="display:flex;gap:24px;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;color:#B8860B;width:44px;flex-shrink:0;">02</div>
      <div style="display:flex;flex-direction:column;padding-bottom:34px;border-left:1px solid #E8E4DF;padding-left:24px;margin-left:-1px;">
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:20px;letter-spacing:2px;color:#1A1A1A;">STILL UNPAID</div>
        <div style="font-family:'Source Sans 3',sans-serif;font-size:24px;color:#6B6B6B;margin-top:8px;">The claim moves to filing — Form SCA 1.</div>
      </div>
    </div>
    <div style="display:flex;gap:24px;">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:24px;color:#B8860B;width:44px;flex-shrink:0;">03</div>
      <div style="display:flex;flex-direction:column;">
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:20px;letter-spacing:2px;color:#1A1A1A;">A HEARING FOLLOWS</div>
        <div style="font-family:'Source Sans 3',sans-serif;font-size:24px;color:#6B6B6B;margin-top:8px;">On the Small Claims Court's own clock — not the regular court queue.</div>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:2.4px;color:#6B6B6B;">PANDAS LP</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2.4px;color:#B8860B;">SWIPE →</div>
  </div>
</div>
</x-dc>
</body>
</html>
