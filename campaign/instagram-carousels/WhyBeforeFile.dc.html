<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #B8860B; }
    a:hover { color: #D4A84B; }
  </style>

<div style="width:1080px;height:1350px;background:#FAFAF8;display:flex;flex-direction:column;box-sizing:border-box;padding:90px 74px 64px;font-family:'Source Sans 3',sans-serif;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:34px;height:1px;background:#B8860B;"></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2.6px;color:#6B6B6B;">BEFORE YOU FILE</div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2px;color:#9A968D;">5 / 6</div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;">
    <div style="font-family:'Playfair Display',serif;font-weight:600;font-size:66px;line-height:1.12;color:#1A1A1A;">Three things</div>
    <div style="font-family:'Playfair Display',serif;font-weight:600;font-style:italic;font-size:66px;line-height:1.12;color:#B8860B;margin-bottom:44px;">decide a claim.</div>

    <div style="display:flex;align-items:flex-start;gap:18px;">
      <div style="display:flex;width:9px;height:9px;border-radius:999px;background:#B8860B;margin-top:12px;flex-shrink:0;"></div>
      <div style="font-family:'Source Sans 3',sans-serif;font-size:31px;line-height:1.4;color:#1A1A1A;">Evidence the debt exists — an invoice, a contract, a message thread</div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:18px;margin-top:26px;">
      <div style="display:flex;width:9px;height:9px;border-radius:999px;background:#B8860B;margin-top:12px;flex-shrink:0;"></div>
      <div style="font-family:'Source Sans 3',sans-serif;font-size:31px;line-height:1.4;color:#1A1A1A;">The debtor's real name and address — courts can't chase a ghost</div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:18px;margin-top:26px;">
      <div style="display:flex;width:9px;height:9px;border-radius:999px;background:#B8860B;margin-top:12px;flex-shrink:0;"></div>
      <div style="font-family:'Source Sans 3',sans-serif;font-size:31px;line-height:1.4;color:#1A1A1A;">Proof you already asked — a demand shows good faith</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:2.4px;color:#6B6B6B;">PANDAS LP</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2.4px;color:#B8860B;">SWIPE →</div>
  </div>
</div>
